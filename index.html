<style>
:root{--bg:#f4f5f7;--cd:#fff;--tx:#1b1f24;--mu:#69707a;--bd:#e3e6ea;--ac:#1f4e79;--ok:#1a7f4b;--bad:#c0392b;--wr:#b7791f;--okb:#e5f4ec;--badb:#fbe9e7;--wrb:#fdf3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171a;--cd:#1e2226;--tx:#eceff3;--mu:#9aa2ad;--bd:#2f353b;--ac:#6fb1ee;--ok:#4cc58a;--bad:#ff8a7d;--wr:#f0b95a;--okb:#16301f;--badb:#3a1d1a;--wrb:#38300f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:14px 14px 100px}
h1{font-size:1.25rem;margin:0 0 10px}h2{font-size:1rem;margin:16px 0 8px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:13px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px}
.k small{color:var(--mu);display:block;font-size:.78rem}.k b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu);font-size:.82rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bdg{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--okb);color:var(--ok);white-space:nowrap}
.bdg.w{background:var(--wrb);color:var(--wr)}.bdg.b{background:var(--badb);color:var(--bad)}
label{display:block;font-size:.8rem;color:var(--mu);margin:9px 0 2px}
input,select{width:100%;padding:10px;font:inherit;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
button{font:inherit;padding:9px 13px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:var(--cd);border-color:var(--ac)}button.d{color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{white-space:nowrap}.chips .on{background:var(--ac);color:var(--cd);border-color:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}.bars i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
